collection_name: agent
persist_directory: chroma_db
k: 3
# vector: only Chroma semantic retrieval; hybrid: semantic recall + BM25 lexical recall.
# On the 500-query holdout, hybrid improved Top-K Hit Rate (97.2% -> 99.4%)
# and Recall@3 (71.08% -> 73.77%) with only 2.54 ms additional latency.
retrieval_mode: hybrid
candidate_k: 8
# RRF fuses semantic and BM25 rankings without comparing their raw score scales.
rrf_k: 60
data_path: data
md5_hex_store: md5.text
allow_knowledge_file_type: ["txt", "pdf", "csv"]

chunk_size: 200
chunk_overlap: 20
separators: ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]
